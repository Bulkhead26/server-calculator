<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务器性能测算器 v3 - 科学校准版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }
    .card { background: white; border-radius: 16px; padding: 30px; margin-bottom: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-bottom: 10px; }
    h2 { color: #555; margin-bottom: 20px; font-size: 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .form-group { display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 8px; color: #555; }
    input, select { padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #667eea; }
    .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
    .btn-primary { background: #667eea; color: white; }
    .btn-primary:hover { background: #5568d3; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .btn-danger { background: #ff4757; color: white; }
    .server-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
    .server-item { border: 2px solid #e0e0e0; border-radius: 12px; padding: 15px; cursor: pointer; transition: all 0.3s; }
    .server-item:hover { border-color: #667eea; }
    .server-item.selected { border-color: #667eea; background: #f0f4ff; }
    .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-top: 20px; }
    .result-card { background: #f8f9fa; border-radius: 12px; padding: 20px; }
    .metric { margin: 10px 0; }
    .metric-label { font-size: 13px; color: #666; }
    .metric-value { font-size: 18px; font-weight: 600; color: #333; }
    .assumption { background: #fff3cd; border-left: 4px solid #ffc107; padding: 10px; margin: 10px 0; font-size: 13px; }
    .measured { background: #d4edda; border-left: 4px solid #28a745; padding: 10px; margin: 10px 0; font-size: 13px; }
    .estimated { background: #cce5ff; border-left: 4px solid #007bff; padding: 10px; margin: 10px 0; font-size: 13px; }
    .calibrated { background: #f8d7da; border-left: 4px solid #dc3545; padding: 10px; margin: 10px 0; font-size: 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔬 服务器性能测算器 v3 - 科学校准版</h1>
      <p style="color: #666; margin-top: 10px;">基于实测数据校准 + 硬件配置的理论测算，明确标注每个假设</p>
    </div>

    <div class="card">
      <h2>📝 服务器配置录入</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>配置名称 *</label>
          <input type="text" id="serverName" placeholder="如：H200 8卡整机">
        </div>
        <div class="form-group">
          <label>整机价格（万元）*</label>
          <input type="number" id="price" placeholder="如：700" step="0.01">
        </div>
        <div class="form-group">
          <label>GPU 型号 *</label>
          <select id="gpuModel" onchange="autoFillGpuSpec()">
            <option value="">请选择</option>
            <option value="H200">H200</option>
            <option value="H100">H100</option>
            <option value="A100">A100</option>
            <option value="A800">A800</option>
            <option value="RTX PRO 6000">RTX PRO 6000</option>
          </select>
        </div>
        <div class="form-group">
          <label>GPU 数量 *</label>
          <input type="number" id="gpuCount" value="8" min="1">
        </div>
        <div class="form-group">
          <label>单卡显存（GB）</label>
          <input type="number" id="gpuMemoryGB" placeholder="如：141" step="0.1">
        </div>
        <div class="form-group">
          <label>单卡显存带宽（GB/s）</label>
          <input type="number" id="gpuMemoryBandwidthGBS" placeholder="如：4800" step="1">
        </div>
      </div>
      <div style="margin-top: 20px;">
        <button class="btn btn-primary" onclick="addServer()">➕ 添加配置</button>
        <button class="btn btn-secondary" onclick="clearForm()">🗑️ 清空表单</button>
      </div>
    </div>

    <div class="card">
      <h2>📋 已添加配置 (<span id="serverCount">0</span>)</h2>
      <p style="color: #666; margin-bottom: 10px;">点击配置卡片可勾选/取消，至少选择 2 个配置进行对比</p>
      <div id="serverList" class="server-list"></div>
      <div style="margin-top: 20px;">
        <button class="btn btn-primary" onclick="calculate()" id="calculateBtn">🧮 开始测算</button>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ 清空所有</button>
      </div>
    </div>

    <div class="card">
      <h2>🎯 业务场景参数</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>部署模型</label>
          <select id="modelName">
            <option value="DeepSeek-V4-Flash">DeepSeek-V4-Flash</option>
            <option value="DeepSeek-V4.1-Flash">DeepSeek-V4.1-Flash</option>
            <option value="DeepSeek-V3">DeepSeek-V3</option>
          </select>
        </div>
        <div class="form-group">
          <label>缓存命中率（%）</label>
          <input type="number" id="cacheHitRate" value="66.38" step="0.01" min="0" max="100">
        </div>
        <div class="form-group">
          <label>平均输入（tokens）</label>
          <input type="number" id="avgInputTokens" value="98000" min="1">
        </div>
        <div class="form-group">
          <label>平均输出（tokens）</label>
          <input type="number" id="avgOutputTokens" value="255" min="1">
        </div>
      </div>
    </div>

    <div id="resultSection" class="card hidden">
      <h2>📊 测算结果</h2>
      <div id="resultContent"></div>
    </div>
  </div>

  <script>
    // GPU 规格数据库
    const GPU_DATABASE = {
      'H200': { memory_gb: 141, bandwidth_gbs: 4800, fp16_tflops: 1979, fp8_tflops: 3958, interconnect: 'NVLink 4.0 + NVSwitch', link_gbs: 900 },
      'H100': { memory_gb: 80, bandwidth_gbs: 3350, fp16_tflops: 1979, fp8_tflops: 3958, interconnect: 'NVLink 4.0 + NVSwitch', link_gbs: 900 },
      'A100': { memory_gb: 80, bandwidth_gbs: 2039, fp16_tflops: 312, fp8_tflops: 0, interconnect: 'NVLink 3 + NVSwitch', link_gbs: 600 },
      'A800': { memory_gb: 80, bandwidth_gbs: 2039, fp16_tflops: 312, fp8_tflops: 0, interconnect: 'NVLink 3', link_gbs: 400 },
      'RTX PRO 6000': { memory_gb: 96, bandwidth_gbs: 1792, fp16_tflops: 374, fp8_tflops: 748, interconnect: 'PCIe 5.0 x16', link_gbs: 128 },
    };

    // 模型规格数据库（按组件分解）
    const MODEL_DATABASE = {
      'DeepSeek-V4-Flash': {
        name: 'DeepSeek-V4-Flash',
        // 显存分解（基于实测 + 官方参数）
        dense_params_b: 5,  // Dense 层参数（FP8）
        routed_experts_params_b: 279,  // 路由专家参数（FP4）
        shared_experts_params_b: 0,  // 共享专家（已计入 dense）
        engram_params_b: 0,  // V4-Flash 无 Engram
        // 实测值（4卡 TP4）
        measured_weight_gb: 154,
        measured_gpu: 'H200',
        // 架构参数
        total_params_b: 284,
        active_params_b: 13,
        num_layers: 43,
        n_routed_experts: 256,
        num_experts_per_tok: 6,
        kv_per_token_bytes: 890,  // FP4 KV cache
        // 校准系数（基于实测 3401 tok/s @ 8×H200）
        bandwidth_utilization: 0.81,  // 81% 带宽利用率（校准后）
        prefill_speed_ratio: 0.65,  // Prefill 速度是 decode 的 65%
        source: '实测校准',
      },
      'DeepSeek-V4.1-Flash': {
        name: 'DeepSeek-V4.1-Flash',
        dense_params_b: 350,
        routed_experts_params_b: 202,
        shared_experts_params_b: 0,
        engram_params_b: 196,  // Engram 表
        measured_weight_gb: null,
        total_params_b: 552,
        active_params_b: 16,
        num_layers: 40,
        n_routed_experts: 384,
        num_experts_per_tok: 6,
        kv_per_token_bytes: 890,
        bandwidth_utilization: 0.65,  // 假设稍低（模型更大）
        prefill_speed_ratio: 0.60,
        source: '官方参数 + 假设',
      },
      'DeepSeek-V3': {
        name: 'DeepSeek-V3',
        dense_params_b: 400,
        routed_experts_params_b: 271,
        shared_experts_params_b: 0,
        engram_params_b: 0,
        measured_weight_gb: null,
        total_params_b: 671,
        active_params_b: 37,
        num_layers: 61,
        n_routed_experts: 256,
        num_experts_per_tok: 8,
        kv_per_token_bytes: 35136,  // FP8 KV (MLA)
        bandwidth_utilization: 0.70,
        prefill_speed_ratio: 0.55,
        source: '官方技术报告 + 假设',
      },
    };

    let servers = [];
    let selectedIds = new Set();
    let lastResult = null;

    function autoFillGpuSpec() {
      const model = document.getElementById('gpuModel').value;
      if (model && GPU_DATABASE[model]) {
        const spec = GPU_DATABASE[model];
        document.getElementById('gpuMemoryGB').value = spec.memory_gb;
        document.getElementById('gpuMemoryBandwidthGBS').value = spec.bandwidth_gbs;
      }
    }

    function addServer() {
      const name = document.getElementById('serverName').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const gpuModel = document.getElementById('gpuModel').value;

      if (!name || !price || !gpuModel) {
        alert('请填写必填项：配置名称、价格、GPU型号');
        return;
      }

      const server = {
        id: Date.now().toString(),
        name,
        price,
        gpu_model: gpuModel,
        gpu_count: parseInt(document.getElementById('gpuCount').value) || 8,
        gpu_memory_gb: parseFloat(document.getElementById('gpuMemoryGB').value) || 0,
        gpu_memory_bandwidth_gbs: parseFloat(document.getElementById('gpuMemoryBandwidthGBS').value) || 0,
      };

      servers.push(server);
      updateServerList();
      clearForm();
    }

    function updateServerList() {
      const listDiv = document.getElementById('serverList');
      const countSpan = document.getElementById('serverCount');
      const calcBtn = document.getElementById('calculateBtn');

      countSpan.textContent = servers.length;
      calcBtn.disabled = selectedIds.size < 2;

      if (servers.length === 0) {
        listDiv.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">暂无配置，请添加服务器配置</p>';
        return;
      }

      listDiv.innerHTML = servers.map(server => `
        <div class="server-item ${selectedIds.has(server.id) ? 'selected' : ''}" onclick="toggleSelect('${server.id}')">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3>${server.name} ${selectedIds.has(server.id) ? '✓' : ''}</h3>
            <button class="btn btn-danger" onclick="event.stopPropagation(); removeServer('${server.id}')" style="padding: 6px 12px; font-size: 14px;">删除</button>
          </div>
          <div class="info">
            <div><span>价格：</span><strong>${server.price}万元</strong></div>
            <div><span>GPU：</span><strong>${server.gpu_model} × ${server.gpu_count}</strong></div>
            <div><span>显存：</span><strong>${server.gpu_memory_gb}GB/卡</strong></div>
            <div><span>带宽：</span><strong>${server.gpu_memory_bandwidth_gbs}GB/s</strong></div>
          </div>
        </div>
      `).join('');
    }

    function toggleSelect(id) {
      if (selectedIds.has(id)) {
        selectedIds.delete(id);
      } else {
        selectedIds.add(id);
      }
      updateServerList();
    }

    function removeServer(id) {
      const server = servers.find(s => s.id === id);
      servers = servers.filter(s => s.id !== id);
      selectedIds.delete(id);
      updateServerList();
    }

    function clearForm() {
      ['serverName', 'price'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('gpuModel').value = '';
      document.getElementById('gpuCount').value = '8';
      document.getElementById('gpuMemoryGB').value = '';
      document.getElementById('gpuMemoryBandwidthGBS').value = '';
    }

    function clearAll() {
      if (confirm('确定要清空所有配置吗？')) {
        servers = [];
        selectedIds.clear();
        updateServerList();
        document.getElementById('resultSection').classList.add('hidden');
      }
    }

    function calculate() {
      if (selectedIds.size < 2) {
        alert('请至少选择 2 个配置进行对比');
        return;
      }

      const modelName = document.getElementById('modelName').value;
      const model = MODEL_DATABASE[modelName];
      
      const business = {
        model_name: modelName,
        cache_hit_rate: parseFloat(document.getElementById('cacheHitRate').value) / 100,
        avg_input_tokens: parseInt(document.getElementById('avgInputTokens').value),
        avg_output_tokens: parseInt(document.getElementById('avgOutputTokens').value),
      };

      const results = [];
      servers.forEach(server => {
        if (selectedIds.has(server.id)) {
          results.push(calculateServer(server, model, business));
        }
      });

      results.sort((a, b) => b.throughput_tps - a.throughput_tps);
      results.forEach((r, i) => r.rank = i + 1);

      lastResult = { business, comparison: results };
      displayResults(lastResult);
    }

    function calculateServer(server, model, business) {
      const gpu = GPU_DATABASE[server.gpu_model] || {
        memory_gb: server.gpu_memory_gb,
        bandwidth_gbs: server.gpu_memory_bandwidth_gbs,
        fp16_tflops: 0,
        fp8_tflops: 0,
        interconnect: '未知',
        link_gbs: null,
      };

      const tp = Math.min(server.gpu_count, 8);
      const instances = Math.floor(server.gpu_count / tp);

      // ===== 权重显存计算（按组件分解）=====
      let weightTotalGb;
      let weightAssumption;
      
      if (model.measured_weight_gb && server.gpu_model === model.measured_gpu) {
        // 有实测数据且 GPU 匹配
        weightTotalGb = model.measured_weight_gb;
        weightAssumption = 'measured';
      } else {
        // 按组件计算
        const denseGb = model.dense_params_b * 1;  // FP8: 1 byte/param
        const routedGb = model.routed_experts_params_b * 0.5;  // FP4: 0.5 byte/param
        const sharedGb = model.shared_experts_params_b * 1;
        const engramGb = model.engram_params_b * 1;
        const scalesGb = (model.dense_params_b + model.routed_experts_params_b + model.shared_experts_params_b) / 32;  // 每 32 参数 1 scale
        const overheadGb = 2;  // 其他开销
        
        weightTotalGb = denseGb + routedGb + sharedGb + engramGb + scalesGb + overheadGb;
        weightAssumption = 'estimated';
      }

      const weightPerGpu = weightTotalGb / tp;

      // ===== KV Cache 显存计算 =====
      const totalGpuMemory = gpu.memory_gb * tp;
      const overheadGb = 2;  // CUDA graph + 系统开销
      const availableForKv = totalGpuMemory - weightTotalGb - overheadGb;
      
      const kvPerToken = model.kv_per_token_bytes;
      const maxKvTokens = Math.floor((availableForKv * 1e9) / kvPerToken);

      // ===== 并发计算 =====
      const sequenceTokens = business.avg_input_tokens + business.avg_output_tokens;
      const maxConcurrencyByKv = Math.floor(maxKvTokens / sequenceTokens);
      
      // 简化：假设计算限制为 KV 限制的 2 倍
      const maxConcurrency = Math.min(maxConcurrencyByKv, maxConcurrencyByKv * 2);

      // ===== 吞吐计算（使用校准系数）=====
      // MoE 模型每个 token 读取量 = dense 层 + 激活的路由专家
      // 简化为：active_params × 平均精度（FP8 dense + FP4 experts 混合约 0.7 字节/参数）
      const avgBytesPerParam = 0.7;
      const weightBytesPerToken = model.active_params_b * 1e9 * avgBytesPerParam;
      
      const totalBandwidth = gpu.bandwidth_gbs * tp * 1e9;  // bytes/s
      const bandwidthUtilization = model.bandwidth_utilization;
      const effectiveBandwidth = totalBandwidth * bandwidthUtilization;
      
      const tokensPerSecond = effectiveBandwidth / weightBytesPerToken;
      const throughputTps = Math.floor(tokensPerSecond * instances);

      // ===== Prefill 延迟 =====
      const prefillTokens = business.avg_input_tokens * (1 - business.cache_hit_rate);
      const prefillSeconds = prefillTokens / (tokensPerSecond * model.prefill_speed_ratio);

      return {
        server_name: server.name,
        price_wan: server.price,
        gpu_model: server.gpu_model,
        gpu_count: server.gpu_count,
        layout: { tensor_parallel: tp, instances },
        memory_analysis: {
          weight_total_gb: weightTotalGb,
          weight_per_gpu_gb: weightPerGpu,
          weight_assumption: weightAssumption,
          kv_per_token_bytes: kvPerToken,
          available_kv_memory_gb: availableForKv,
          max_kv_tokens: maxKvTokens,
        },
        throughput_analysis: {
          max_concurrency: maxConcurrency,
          prefill_ms: prefillSeconds * 1000,
          output_throughput_tps: throughputTps,
        },
        assumptions: {
          bandwidth_utilization: bandwidthUtilization,
          prefill_speed_ratio: model.prefill_speed_ratio,
          calibrated: model.source === '实测校准',
        },
        rank: 0,
      };
    }

    function displayResults(result) {
      const resultSection = document.getElementById('resultSection');
      const resultContent = document.getElementById('resultContent');
      resultSection.classList.remove('hidden');

      const businessInfo = `
        <div style="background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
          <h3 style="margin-bottom: 15px;">业务场景参数</h3>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div><strong>模型：</strong>${result.business.model_name}</div>
            <div><strong>缓存命中率：</strong>${(result.business.cache_hit_rate * 100).toFixed(2)}%</div>
            <div><strong>平均输入：</strong>${result.business.avg_input_tokens.toLocaleString()} tokens</div>
            <div><strong>平均输出：</strong>${result.business.avg_output_tokens} tokens</div>
          </div>
        </div>
      `;

      const resultCards = result.comparison.map(r => {
        let weightBadge;
        if (r.memory_analysis.weight_assumption === 'measured') {
          weightBadge = '<span class="measured">✓ 实测数据</span>';
        } else if (r.assumptions.calibrated) {
          weightBadge = '<span class="calibrated">⚙ 估算（已校准）</span>';
        } else {
          weightBadge = '<span class="estimated">⚠ 估算值</span>';
        }

        return `
        <div class="result-card">
          <span style="background: #667eea; color: white; padding: 4px 12px; border-radius: 12px; font-size: 12px;">排名 #${r.rank}</span>
          <h3 style="margin-top: 10px;">${r.server_name}</h3>
          <div class="metric">
            <span class="metric-label">价格</span>
            <span class="metric-value">${r.price_wan}万元</span>
          </div>
          <div class="metric">
            <span class="metric-label">部署布局</span>
            <span class="metric-value">TP${r.layout.tensor_parallel} × ${r.layout.instances} 实例</span>
          </div>
          <div class="metric">
            <span class="metric-label">权重占用</span>
            <span class="metric-value">${r.memory_analysis.weight_total_gb.toFixed(1)} GB</span>
            ${weightBadge}
          </div>
          <div class="metric">
            <span class="metric-label">单卡权重</span>
            <span class="metric-value">${r.memory_analysis.weight_per_gpu_gb.toFixed(1)} GB</span>
          </div>
          <div class="metric">
            <span class="metric-label">可用KV显存</span>
            <span class="metric-value">${r.memory_analysis.available_kv_memory_gb.toFixed(1)} GB</span>
          </div>
          <div class="metric">
            <span class="metric-label">单token KV</span>
            <span class="metric-value">${r.memory_analysis.kv_per_token_bytes} bytes</span>
          </div>
          <div class="metric">
            <span class="metric-label">最大KV容量</span>
            <span class="metric-value">${(r.memory_analysis.max_kv_tokens / 1e6).toFixed(1)}M tokens</span>
          </div>
          <div class="metric">
            <span class="metric-label">最大并发</span>
            <span class="metric-value">${r.throughput_analysis.max_concurrency} 请求</span>
          </div>
          <div class="metric">
            <span class="metric-label">Prefill延迟</span>
            <span class="metric-value">${r.throughput_analysis.prefill_ms.toFixed(0)} ms</span>
          </div>
          <div class="metric">
            <span class="metric-label">聚合输出吞吐</span>
            <span class="metric-value" style="font-size: 24px; color: #667eea;">${r.throughput_analysis.output_throughput_tps.toLocaleString()} tok/s</span>
          </div>
          <div class="assumption">
            <strong>假设说明：</strong><br>
            • 带宽利用率：${(r.assumptions.bandwidth_utilization * 100).toFixed(0)}%<br>
            • Prefill速度：decode的${(r.assumptions.prefill_speed_ratio * 100).toFixed(0)}%<br>
            ${r.assumptions.calibrated ? '• 已用实测数据校准' : '• 基于硬件规格估算'}
          </div>
        </div>
      `}).join('');

      const best = result.comparison[0];
      const summary = `
        <div style="background: #e7f3ff; border-left: 4px solid #2196F3; padding: 20px; border-radius: 8px; margin-top: 20px;">
          <h3>💡 推荐建议</h3>
          <div style="margin-top: 15px;">
            <strong>🏆 最高吞吐：</strong>${best.server_name}<br>
            ${best.throughput_analysis.output_throughput_tps.toLocaleString()} tok/s<br>
            <strong>💰 单位成本：</strong>${(best.price_wan / best.throughput_analysis.output_throughput_tps * 10000).toFixed(2)} 元/(tok/s)
          </div>
          <div style="margin-top: 15px; font-size: 13px; color: #666;">
            <strong>注意：</strong>以上为理论测算值，实际性能受部署配置、网络、散热等因素影响。
            ${result.comparison.some(r => r.memory_analysis.weight_assumption === 'estimated') ? '部分配置使用估算值，建议实测验证。' : ''}
          </div>
        </div>
      `;

      resultContent.innerHTML = businessInfo + '<div class="result-grid">' + resultCards + '</div>' + summary;
      resultSection.scrollIntoView({ behavior: 'smooth' });
    }

    // 启动时恢复本地存档
    loadServers();
    updateServerList();
  </script>
</body>
</html>
